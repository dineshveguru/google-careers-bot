name: Check Google Careers

on:
  schedule:
    # Every five minutes, offset from the top of the hour to reduce queue delays.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out monitor state
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check for new matching roles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_URL: ${{ vars.SEARCH_URL }}
          ROLE_KEYWORDS: ${{ vars.ROLE_KEYWORDS }}
        run: npm run check

      - name: Save updated role state
        run: |
          git config user.name "google-careers-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-jobs.json
          git diff --cached --quiet || git commit -m "chore: update seen Google Careers roles"
          git push
